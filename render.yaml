services:
  - type: web
    name: kritika-telegram-bot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: ./node_modules/.bin/tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: APP_URL
        value: ""
