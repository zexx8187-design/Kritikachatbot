services:
  - type: web
    name: kritika-telegram-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: cognitivecomputations/dolphin-mistral-24b-venice-edition:free
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
